name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55446/accly_test
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
      BETTER_AUTH_URL: https://api.ci.invalid
      BETTER_AUTH_COOKIE_DOMAIN: .ci.invalid
      CORS_ORIGIN: https://ci.invalid
      FOUNDING_EMAIL: founder@ci.invalid
      NODE_ENV: test
      SEAWEEDFS_ENDPOINT: http://127.0.0.1:55447
      SEAWEEDFS_BUCKET: files
      SEAWEEDFS_ACCESS_KEY_ID: better-stack
      SEAWEEDFS_SECRET_ACCESS_KEY: better-stack-secret
      VITE_SERVER_URL: https://api.ci.invalid
      VITE_WEB_URL: https://ci.invalid
      VITE_WHATSAPP_NUMBER: "919999999999"
      VITE_CONTACT_EMAIL: hello@ci.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@820762786026740c76f36085b0efc47a31fe5020 # v7

      - name: Set up Node.js
        uses: actions/setup-node@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx oxlint

      - name: Check formatting
        run: bunx oxfmt --check .

      - name: Check types
        run: bun run check-types

      - name: Start disposable test services
        run: bun run db:up

      - name: Test
        run: bun run test

      - name: Build
        env:
          NODE_ENV: production
        run: bun run build
